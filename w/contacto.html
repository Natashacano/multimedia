<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Natasha Cano</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        /* --- Reset y Estilos Generales --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #dad7d7;
            overflow: hidden;
        }

        /* --- Contenedor Principal --- */
        .grid-container {
            display: grid;
            /* Forzamos las dos columnas para que no se apilen una arriba de otra */
            grid-template-columns: 35% 65%; 
            height: 100vh;
            width: 100vw;
            background-image: url('img/spam\ ojo.jpeg'); 
            background-size: 65%; /* Cambié a cover para que llene mejor el espacio */
            background-position: right;
            background-repeat: no-repeat;
            background-color: #191818;
        }

        /* Ajuste para móviles: si la pantalla es muy chica, el cuadro negro crece */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 100%;
            }
        }

        /* --- Panel Izquierdo (Info de Contacto) --- */
        .left-panel {
            background-color: #191818;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 10% 10%; 
            height: 100%;
            box-sizing: border-box;
            /* Esto asegura que el panel esté por encima del fondo y sea clickeable */
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            margin-top: 0;
            margin-bottom: 30px;
            color:#dad7d7;
        }

        .contact-details {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.1rem;
        }

        .contact-icon {
            color: #972a2af0;
            font-size: 1.8rem;
        }

        .contact-text strong {
            display: block; 
            text-transform: uppercase;
            font-size: 0.8rem;
            color: #b1aaaa;
            margin-bottom: 3px;
        }

        .contact-link {
            text-decoration: none;
            color: #dad7d7;
            font-weight: bold;
            transition: color 0.3s ease;
            position: relative;
            z-index: 10; /* Máxima prioridad para el click */
        }

        .contact-link:hover {
            color: #861111f0;
        }

        .back-btn {
            display: flex;
            align-items: center;
            margin-top: auto; 
            padding-bottom: 40px;
            text-decoration: none;
            color: #888;
            font-size: 0.9rem;
            transition: color 0.3s ease;
            position: relative;
            z-index: 10;
        }

        .back-btn:hover {
            color: #ffffff;
        }

        /* --- Panel Derecho (Transparente para ver la foto) --- */
        .right-panel {
            background: transparent;
            /* Eliminé el ::after porque estaba bloqueando los clicks */
        }

    </style>
</head>
<body>

    <div class="grid-container">
        
        <div class="left-panel">
            <h1>Contacto</h1>

            <div class="contact-details">
                <div class="contact-item">
                    <span class="material-symbols-outlined contact-icon">person</span>
                    <div class="contact-text">
                        <strong>Nombre:</strong>
                        <a href="biografia.html" class="contact-link">Natasha Renee Cano Moya</a>
                    </div>
                </div>

                <div class="contact-item">
                    <span class="material-symbols-outlined contact-icon">mail</span>
                    <div class="contact-text">
                        <strong>Correo:</strong>
                        <a href="mailto:ncanom@uft.edu" class="contact-link">ncanom@uft.edu</a>
                    </div>
                </div>

                <div class="contact-item">
                    <span class="material-symbols-outlined contact-icon">camera_enhance</span>
                    <div class="contact-text">
                        <strong>Instagram:</strong>
                        <a href="https://instagram.com/lagrimitadibuja" target="_blank" class="contact-link">lagrimitadibuja</a>
                    </div>
                </div>
            </div>

            <a href="index.html" class="back-btn">
                <span class="material-symbols-outlined" style="font-size: 1.2rem; margin-right: 5px;">arrow_back</span>
                Volver al inicio
            </a>
        </div>

        <div class="right-panel"></div>

    </div>

</body>
</html>
