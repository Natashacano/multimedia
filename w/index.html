<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natasha Cano - Portafolio</title>
    <style>
        /* Estética de Galería Contemporánea */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #000; /* Fondo base antes de cargar imagen */
            color: #ffffff;
            overflow: hidden;
        }

        /* Imagen de fondo sin "ensuciar" */
        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('img/collage_de_pinturas.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        /* Capa de brillo sutil para asegurar legibilidad si la foto es clara */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2); /*/
            z-index: 2;
        }

        /* Contenedor de Interfaz (Encima de la imagen) */
        .interface {
            position: relative;
            z-index: 3;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Empuja el contenido a los extremos */
            padding: 60px; /* Margen de respiro desde los bordes */
            box-sizing: border-box;
        }

        /* Nombre de la artista  */
        h1 {
            font-size: 1.2rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 5px; /* Mucho espacio  */
            margin: 0;
            display: inline-block;
        }

        /* Menú de navegación */
        nav {
            display: flex;
            gap: 40px; /* Espacio horizontal entre links */
            justify-content: flex-end; /* Alineado a la derecha */
        }

        .link {
            text-decoration: none;
            color: #ffffff;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 400;
            transition: opacity 0.3s ease;
            border-bottom: 1px solid transparent;
            padding-bottom: 5px;
        }

        .link:hover {
            opacity: 0.6;
            border-bottom: 1px solid #050505;
        }

        /* Texto de apoyo opcional  */
        .footer-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        /* Ajustes para móviles */
        @media (max-width: 768px) {
            .interface {
                padding: 30px;
            }
            nav {
                flex-direction: column;
                gap: 15px;
                text-align: right;
            }
            h1 {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="background-image"></div>
    <div class="overlay"></div>

    <div class="interface">
        <header style="display: flex; justify-content: space-between; align-items: baseline;">
            <h1>Natasha Cano</h1>
            
            <nav>
                <a href="obras.html" class="link">Obras</a>
                <a href="biografia.html" class="link">Statement</a>
                <a href="contacto.html" class="link">Contacto</a>
            </nav>
        </header>

        <div class="footer-tag">
            Artista Visual
        </div>
    </div>

</body>
</html>
