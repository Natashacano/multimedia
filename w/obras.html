<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obras - Natasha Cano</title>
    <style>
        /* Estética Minimalista Curada */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #efeeee;
            color: #000;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Contenedor más estrecho para que la obra no sea gigante */
        .container {
            max-width: 650px; /* Tamaño reducido para mayor elegancia */
            margin: 0 auto;
            padding: 100px 30px;
        }

        header {
            margin-bottom: 120px;
        }

        h1 {
            font-size: 0.8rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            color: #1a1a1a;
        }

        /* Galería en una sola columna */
        .galeria {
            display: flex;
            flex-direction: column;
            gap: 100px; /* Espacio entre cada pieza */
            align-items: center;
        }

        .obra-item {
            width: 100%;
            text-align: left;
        }

        .obra-item img {
            width: 100%; /* Se adapta al ancho de 650px del contenedor */
            height: auto;
            display: block;
            transition: opacity 0.5s ease;
        }

        .obra-item img:hover {
            opacity: 0.8;
        }

        /* Etiquetas sutiles */
        .obra-info {
            margin-top: 20px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #000000;
            font-weight: 300;
        }

        /* Navegación inferior */
        .footer-nav {
            margin-top: 150px;
            padding-top: 40px;
        }

        .btn-volver {
            text-decoration: none;
            color: #000;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid transparent;
            transition: border 0.3s ease;
        }

        .btn-volver:hover {
            border-bottom: 1px solid #000;
        }

        /* Optimización para móviles */
        @media (max-width: 768px) {
            .container {
                padding: 60px 20px;
            }
            header {
                margin-bottom: 70px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Natasha Cano — Trabajos</h1>
        </header>

        <main class="galeria">
            <div class="obra-item">
                <img src="img/collage de pinturas.jpg" alt="Pérdida">
                <div class="obra-info">Pérdida, 2026</div>
            </div>


            <div class="obra-item">
                <img src="img/$PAM.jpg" alt="$PAM">
                <div class="obra-info">$PAM, 2025</div>
            </div>


            <div class="obra-item">
                <img src="img/Penitente.jpg" alt="Penitente">
                <div class="obra-info">Penitente, 2025</div>
            </div>

              <div class="obra-item">
                <img src="img/Reflejos.jpeg" alt="Reflejos">
                <div class="obra-info">Reflejos, 2024</div>
            </div>

            <div class="obra-item">
                <img src="img/ai porn.jpg" alt="Blank Room Soup">
                <div class="obra-info">Blank Room Soup, 2026</div>
            </div>
        
        </main>

        <footer class="footer-nav">
            <a href="index.html" class="btn-volver">Volver al Inicio</a>
        </footer>
    </div>

</body>
</html>
